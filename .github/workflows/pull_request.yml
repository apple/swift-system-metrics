name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.19
    with:
      license_header_check_project_name: "Swift System Metrics API"

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      # Linux: debug tests (strict flags on releases, no -warnings-as-errors on nightlies) and
      # release builds (no extra flags), matching the former unit_tests.yml and release_builds.yml jobs.
      linux_command: |
        Debug-Test:
          command: swift test -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["current-2", "current-1", "current"]
        Debug-Test-Nightly:
          command: swift test --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["nightly-release", "nightly-main"]
        Release-Build: swift build -c release
      macos_runner_pool: general
      macos_swift_versions: '["current-2", "current-1", "current"]'
      macos_xcode_versions: '["latest-beta"]'
      xcode_scheme: swift-system-metrics
      xcode_debug_output: true
      xcode_targets: |
        macOS:
          build: true
          test: true
        Catalyst:
          build: true
          test: true
        iOS:
          build: true
        watchOS:
          build: true
        tvOS:
          build: true
        visionOS:
          build: true
      linux_static_sdk_versions: '["current", "nightly-main"]'
      enable_windows: false
      enable_macos_swiftly: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_cxx_interop: false
      enable_freebsd: false

  example-packages:
    name: Build Examples
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      name: example-packages
      linux_swift_versions: '["current-2", "current-1", "current"]'
      linux_setup_command: git config --global --add safe.directory /swift-system-metrics
      linux_command: ./Scripts/test-examples.sh
      enable_macos: false
      enable_macos_swiftly: false
      enable_windows: false
      enable_linux_static_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_cxx_interop: false
      enable_freebsd: false
